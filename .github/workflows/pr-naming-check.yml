name: PR Naming Convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: PR Title Convention
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Ticket id is optional. Use [[:space:]] — bash ERE does not support \s.
          if [[ ! "$TITLE" =~ ^(\[?[A-Z][A-Z0-9]*-[0-9]+\]?[[:space:]]*)?(feat|fix|chore|docs|refactor|test|style|ci|build|perf)(\([a-z0-9-]+\))?!?:[[:space:]]+.+$ ]]; then
            echo "::error::PR title must follow: type(scope): description (optional [TICKET-ID] prefix)"
            echo "Examples: chore(ci): add deploy workflows | [ARC-123] feat: add hero CTA | fix: resolve mobile nav"
            echo "Got: $TITLE"
            exit 1
          fi
          echo "PR title OK: $TITLE"
