name: PR Naming Convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: PR Title Convention
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^(\[?[A-Z][A-Z0-9]*-[0-9]+\]?\s*)?(feat|fix|chore|docs|refactor|test|style|ci|build|perf)(\([a-z0-9-]+\))?!?:\s+.+ ]]; then
            echo "::error::PR title must follow: [TICKET-ID] type(scope): description"
            echo "Examples: [ARC-123] feat: Add hero CTA | fix: Resolve mobile nav"
            echo "Got: $TITLE"
            exit 1
          fi
          echo "PR title OK: $TITLE"
